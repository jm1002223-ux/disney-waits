name: collect-wait-times

# GitHub の定期実行(schedule)がこのアカウントで起動しないため、自分で次の回を予約する方式にしている。
# 1回の実行で約5時間50分動き、その間5分おきに collect.py を実行して data/ を保存する。
# 開始直後に次の回を予約する(workflow_dispatch)。同時には1つしか動かないので、次の回は今の回が終わるまで待つ。
# 止めるとき:Actions の画面で「Disable workflow」。
on:
  workflow_dispatch: {}       # 手動実行ボタン(と、自分自身による次の回の予約)
  push:
    branches: [main]
    paths: [".github/workflows/collect-waits.yml"]   # この設定を変えたときに1回目を起動する

permissions:
  contents: write   # data/ の保存
  actions: write    # 次の回の予約

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Schedule next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-waits.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Collect every 5 minutes (about 5h50m)
        run: |
          git config user.name "wait-time-bot"
          git config user.email "wait-time-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git pull --rebase --quiet || git rebase --abort || true
            python collect.py || echo "collect.py failed (次の回で再試行)"
            git add data
            if ! git diff --cached --quiet; then
              git commit --quiet -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
              git push --quiet || { git pull --rebase --quiet && git push --quiet; } || echo "push failed (次の回で再試行)"
            fi
            left=$(( 300 - ($(date +%s) - start) ))
            [ "$left" -gt 0 ] && sleep "$left"
          done
