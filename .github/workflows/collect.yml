name: collect-wait-times

on:
  schedule:
    # 5分おき・現地(太平洋時間)の7時〜24時ごろだけ。cronはUTCで書く(12月は太平洋標準時=UTC-8)
    # GitHubが混んでいると実行が遅れ、実際は10〜15分おきになる時間帯もある
    - cron: "*/5 0-8,15-23 * * *"
  workflow_dispatch: {}       # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch wait times
        run: python collect.py
      - name: Commit
        run: |
          git config user.name "wait-time-bot"
          git config user.email "wait-time-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new data"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet || true
            git push
          fi
